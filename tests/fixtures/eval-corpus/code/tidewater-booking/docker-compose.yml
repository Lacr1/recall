services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tidewater
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: booking
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailcatcher:
    image: sj26/mailcatcher
    ports:
      - "1080:1080"
volumes:
  pgdata:
